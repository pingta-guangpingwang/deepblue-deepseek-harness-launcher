name: Upload fixed 0.10.37 verified public artifacts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pingta-guangpingwang/deepblue-deepseek-harness-launcher
    steps:
      # No checkout, third-party action, signing key, user data, or downloaded
      # executable is used. This one-off publisher cannot move catalog pointers.
      - name: Fetch exact OSS bytes, check hashes and fill existing draft releases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          scratch="$(mktemp -d)"
          upload_fixed() {
            local release_id="$1" tag="$2" object="$3" expected_sha="$4" expected_size="$5"
            local name="${object##*/}"
            gh api "repos/$REPOSITORY/releases/$release_id" > "$scratch/metadata.json"
            test "$(jq -r .tag_name "$scratch/metadata.json")" = "$tag"
            test "$(jq -r .target_commitish "$scratch/metadata.json")" = cb560735c509363ea2e51d9c23a465d44d57adec
            local existing="$(jq --arg name "$name" '[.assets[] | select(.name==$name)] | length' "$scratch/metadata.json")"
            if test "$existing" != 0; then
              test "$existing" = 1
              test "$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .state' "$scratch/metadata.json")" = uploaded
              test "$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .size' "$scratch/metadata.json")" = "$expected_size"
              test "$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .digest' "$scratch/metadata.json")" = "sha256:$expected_sha"
              echo "Exact existing artifact retained: $name"
              return
            fi
            curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 --max-time 900 \
              "https://ailishishu-deepseek-harness.oss-cn-beijing.aliyuncs.com/$object" -o "$scratch/$name"
            test "$(stat -c%s "$scratch/$name")" = "$expected_size"
            printf '%s  %s\n' "$expected_sha" "$scratch/$name" | sha256sum --check -
            gh release upload "$tag" "$scratch/$name" --repo "$REPOSITORY"
            gh api "repos/$REPOSITORY/releases/$release_id" > "$scratch/metadata.json"
            test "$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .digest' "$scratch/metadata.json")" = "sha256:$expected_sha"
            echo "Verified uploaded artifact: $name"
          }
          upload_fixed 408653626 runtime-module-harness-core-0.2.1-alpha.2-b7c338488b4c2184 \
            modules/harness-core-0.2.1-alpha.2-win-x64-b7c338488b4c2184.tar.gz \
            b7c338488b4c218452d6f8466f83b9172816bd1066f2d3152a25bce746995049 166505269
          upload_fixed 408653627 v0.10.37 \
            download/deepblue-deepseek-harness-launcher-0.10.37-win-x64-offline.exe \
            7d05e8bdf4e9db7ed4ab3059703c3e230c97e1d1060b56185c4dacdf501936b4 248386490
      - name: Anonymous full-byte readback of all six public GitHub artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          scratch="$(mktemp -d)"
          verify_public() {
            local tag="$1" name="$2" expected_sha="$3" expected_size="$4"
            local final_url
            final_url="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --show-error --location \
              --max-time 900 --max-filesize "$expected_size" --retry 2 \
              "https://github.com/$REPOSITORY/releases/download/$tag/$name" \
              -o "$scratch/$name" -w '%{url_effective}')"
            case "$final_url" in https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;; *) exit 2 ;; esac
            test "$(stat -c%s "$scratch/$name")" = "$expected_size"
            printf '%s  %s\n' "$expected_sha" "$scratch/$name" | sha256sum --check -
            printf 'PUBLIC_READBACK_VERIFIED %s %s %s\n' "$name" "$expected_sha" "$expected_size"
          }
          verify_public runtime-v0.10.37 launcher-shell-0.10.37-win-x64-e9cf0d54245ac931.7z \
            e9cf0d54245ac931847699f731018b55c9d873eb6925d5e6939af5508f97309c 83599489
          verify_public v0.10.37 deepblue-deepseek-harness-launcher-0.10.37-win-x64-online.exe \
            8190f143d2d80455ba09a4ac554dce7b8dbfbf7423e710a1b0579ce00c10207a 697151
          verify_public v0.10.37 deepblue-deepseek-harness-launcher-0.10.37-win-x64-offline.exe \
            7d05e8bdf4e9db7ed4ab3059703c3e230c97e1d1060b56185c4dacdf501936b4 248386490
          verify_public runtime-module-harness-core-0.2.1-alpha.2-b7c338488b4c2184 harness-core-0.2.1-alpha.2-win-x64-b7c338488b4c2184.tar.gz \
            b7c338488b4c218452d6f8466f83b9172816bd1066f2d3152a25bce746995049 166505269
          verify_public launcher-ui-ui-9961461627cc7864 launcher-ui-ui-9961461627cc7864-win-x64-5539a1b1b65ea194.tar.gz \
            5539a1b1b65ea1948971daf6267e6aa528c056e5f7efbed41b86d39780383911 857894
          verify_public agent-host-1.0.0+dd5ebb1b6efa agent-host-1.0.0+dd5ebb1b6efa-win-x64.tar.gz \
            5f2dff2ee79b5e1b043c8a0918c9a64bc756760302fd18c4a5d305220f12aca2 291244
